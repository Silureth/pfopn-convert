[[plugin]]
id = "wireguard"
pfsense_markers = ["wireguard"]
opnsense_markers = ["os-wireguard", "wireguard"]
compatible_targets = ["pfsense", "opnsense"]
status = "supported"
note = "Supported on both platforms."

[[plugin]]
id = "tailscale"
pfsense_markers = ["tailscale", "tailscaleauth"]
opnsense_markers = ["os-tailscale", "tailscale"]
compatible_targets = ["pfsense", "opnsense"]
status = "supported"
note = "Supported on both platforms."

[[plugin]]
id = "openvpn"
pfsense_markers = ["openvpn", "ovpnserver", "openvpn-client-export", "openvpn client export utility"]
opnsense_markers = ["openvpn", "os-openvpn-legacy"]
compatible_targets = ["pfsense", "opnsense"]
status = "supported"
note = "Core OpenVPN config exists on both platforms."

[[plugin]]
id = "ipsec"
pfsense_markers = ["ipsec"]
opnsense_markers = ["ipsec", "swanctl", "os-strongswan-legacy"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "Both support IPsec but layout and option names differ."

[[plugin]]
id = "isc-dhcp"
pfsense_markers = ["dhcpd", "dhcpdv6", "dhcpd6"]
opnsense_markers = ["os-isc-dhcp", "dhcpd", "dhcpd6", "dhcpdv6"]
compatible_targets = ["pfsense", "opnsense"]
status = "supported"
note = "Legacy ISC DHCP backend is available on both."

[[plugin]]
id = "kea-dhcp"
pfsense_markers = ["kea", "dhcpbackend"]
opnsense_markers = ["kea", "os-kea"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "Kea is available on both but XML layout differs."

[[plugin]]
id = "pfblockerng"
pfsense_markers = ["pfblockerng", "pfblockerng-devel"]
opnsense_markers = []
compatible_targets = ["pfsense"]
status = "unsupported"
note = "No direct OPNsense equivalent."

[[plugin]]
id = "system_patches"
pfsense_markers = ["system patches", "system_patches", "system_patches_pkg"]
opnsense_markers = []
compatible_targets = ["pfsense"]
status = "unsupported"
note = "No direct OPNsense equivalent."

[[plugin]]
id = "zabbix-agent"
pfsense_markers = ["zabbix agent 7", "zabbix agent 6", "zabbix agent lts", "zabbix-agent7", "zabbix-agent6", "zabbix-agent-lts"]
opnsense_markers = ["os-zabbix7-agent", "os-zabbix74-agent", "os-zabbix6-agent"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "Settings, PSK encryption and user parameters are converted when the plugin is in the baseline; certificate TLS is not."

[[plugin]]
id = "zabbix-proxy"
pfsense_markers = ["zabbix proxy 7", "zabbix proxy 6", "zabbix proxy lts", "zabbix-proxy7", "zabbix-proxy6", "zabbix-proxy-lts"]
opnsense_markers = ["os-zabbix7-proxy", "os-zabbix74-proxy", "os-zabbix6-proxy"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "Mode, server, listen settings and PSK encryption are converted when the plugin is in the baseline; TrapperTimeout, SNMP trapper, advanced parameters and certificate TLS are not."

[[plugin]]
id = "node_exporter"
pfsense_markers = ["node_exporter"]
opnsense_markers = ["os-node_exporter"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "Converted when the plugin is in the baseline; collectors the plugin lacks (boottime, textfile) and extra flags are dropped."

[[plugin]]
id = "qemu-guest-agent"
pfsense_markers = []
opnsense_markers = ["os-qemu-guest-agent"]
compatible_targets = ["pfsense", "opnsense"]
status = "supported"
note = "pfSense starts it from Shellcmd; OPNsense has a plugin. Enabled when the plugin is in the baseline."

[[plugin]]
id = "net-snmp"
pfsense_markers = []
opnsense_markers = ["os-net-snmp"]
compatible_targets = ["pfsense", "opnsense"]
status = "partial"
note = "pfSense's built-in SNMP daemon (bsnmpd) becomes os-net-snmp when the plugin is in the baseline: community, location, contact, bind address. The pf, netgraph and regex MIB modules have no equivalent."

[[plugin]]
id = "shellcmd"
pfsense_markers = ["shellcmd"]
opnsense_markers = []
compatible_targets = ["pfsense"]
status = "partial"
note = "No OPNsense equivalent; a qemu-guest-agent start command becomes the os-qemu-guest-agent plugin, other commands need /usr/local/etc/rc.syshook.d/ scripts."
